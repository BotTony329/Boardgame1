<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格子天下 · PolitGrid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>格子天下<small>POLITGRID</small></span></div>
  <div id="nationBadge"></div>
  <div id="resBar"></div>
  <button id="btnNewGame" class="ghost">新开局</button>
</header>

<main>
  <section id="mapPane">
    <div class="panel-heading map-heading">
      <div><span class="eyebrow">WORLD ATLAS</span><h2>天下舆图</h2></div>
      <span class="panel-note">疆域、聚落与山川资源</span>
    </div>
    <div class="map-frame"><canvas id="map"></canvas></div>
    <div class="map-footer">
      <div id="mapLegend"></div>
      <div id="cellInfo">点击格子查看详情</div>
    </div>
  </section>

  <aside id="sidePane">
    <div class="card" id="nationCard"></div>

    <div class="card policy-card">
      <div class="card-heading">
        <div><span class="eyebrow">STATECRAFT</span><h3>颁布国策</h3></div>
        <span class="card-tools">
          <button id="btnArchive" class="ghost small">政策档案</button>
          <button id="btnSuggest" class="ghost small">换一策</button>
        </span>
      </div>
      <div id="currentPolicy"></div>
      <div id="domainChips"></div>
      <textarea id="policyText" rows="5"
        placeholder="以文字颁布本回合国策。例如：轻徭薄赋，开仓放粮赈济流民；兴修水利、垦荒屯田；广设医馆学堂；与四邻开互市……"></textarea>
      <div id="reformHint"></div>
      <div class="row spread">
        <span id="aiHint">由千问3.7 扮演天命史官裁决政策效果</span>
        <button id="btnPolicy">颁布政策</button>
      </div>
    </div>

    <div class="card" id="militaryCard"></div>
  </aside>
</main>

<section id="logPane">
  <div class="panel-heading">
    <div><span class="eyebrow">CHRONICLE</span><h2>编年史</h2></div>
    <span class="panel-note">新事在上，旧事在下</span>
  </div>
  <div id="logList"></div>
</section>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
