<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格子天下 · PolitGrid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>格子天下<small>POLITGRID</small></span></div>
  <div id="nationBadge"></div>
  <div id="resBar"></div>
  <button id="btnNewGame" class="ghost">新开局</button>
</header>

<main>
  <div id="leftCol">
    <section id="mapPane">
      <div class="panel-heading map-heading">
        <div><span class="eyebrow">WORLD ATLAS</span><h2>天下舆图</h2></div>
        <span class="panel-note">疆域、聚落与山川资源</span>
      </div>
      <div class="map-frame"><canvas id="map"></canvas></div>
      <div class="map-footer">
        <div id="mapLegend"></div>
        <div id="cellInfo">点击格子查看详情</div>
      </div>
    </section>

    <section id="worldPane" class="card">
      <div class="panel-heading world-heading">
        <div><span class="eyebrow">WORLD LEDGER</span><h2>万国志</h2></div>
        <nav id="worldTabs">
          <button class="tab on" data-tab="chronicle">编年史</button>
          <button class="tab" data-tab="events">大事记</button>
          <button class="tab" data-tab="relations">列国关系</button>
          <button class="tab" data-tab="trade">贸易往来</button>
        </nav>
      </div>
      <div id="worldBody"><div id="logList"></div></div>
    </section>
  </div>

  <aside id="sidePane">
    <div class="card" id="nationCard"></div>

    <div class="card policy-card">
      <div class="card-heading">
        <div><span class="eyebrow">STATECRAFT</span><h3>施政</h3></div>
        <span class="card-tools">
          <button id="btnArchive" class="ghost small">政策档案</button>
          <button id="btnSuggest" class="ghost small">换一策</button>
        </span>
      </div>
      <div id="currentPolicy"></div>
      <div id="domainChips"></div>
      <textarea id="policyText" rows="5"
        placeholder="以文字颁布施政。例如：轻徭薄赋，开仓放粮赈济流民；兴修水利、垦荒屯田；广设医馆学堂；与四邻开互市……"></textarea>
      <div id="reformHint"></div>
      <div class="row spread">
        <span id="aiHint">千问3.7 裁定力度 · 施政持续生效、效力随岁月衰减</span>
        <button id="btnPolicy">颁布施政</button>
      </div>
      <div id="activePolicies"></div>
      <button id="btnNextTurn" class="next-turn">结束本回合 · 进入下一年</button>
    </div>

    <div class="card" id="militaryCard"></div>
  </aside>
</main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
